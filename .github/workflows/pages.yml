# Публікація brand.sneco.ua (28.09.2026, аудит T-12, рішення Вадима).
# ⚠ НАВІЩО. Раніше Pages віддавав увесь репо, зокрема AGENTS.md, CLAUDE.md,
#   memory/ і .gitignore (службова памʼять агентів). Тепер сайт збирається
#   з копії репо без цих файлів; решта (дашборди, лого, шрифти) — як була.
# ⚠ Відкат: gh api -X PUT repos/dreamcarua/sneco-brand-book/pages \
#     -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/'
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Прибрати службові файли
        run: |
          rm -rf .git .github AGENTS.md CLAUDE.md memory .gitignore .DS_Store
          find . -name '.DS_Store' -delete
          test -f CNAME && test -f index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
