<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>snEco — Витрати та окупність</title>
<style>
:root{--yel:#FCC01B;--grn:#8DC63F;--dark:#1E1E1E;--line:#E5E5DC;--muted:#7a7a72;
      --red:#DC2626;--amb:#D97706;--bg:#F7F7F3}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
     background:var(--bg);color:var(--dark);font-size:14px;line-height:1.5}
body.dash-locked{overflow:hidden}
/* ── auth gate ── */
#dashauth-overlay{position:fixed;inset:0;background:#1E1E1E;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
#dashauth-overlay.is-hidden{display:none}
.dashauth-card{background:#fff;width:100%;max-width:440px;border-radius:14px;padding:36px 30px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dashauth-logo{font-size:24px;font-weight:900;color:var(--yel);margin-bottom:6px;letter-spacing:-.5px;text-align:center}
.dashauth-sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#888;text-align:center;margin-bottom:24px}
.dashauth-icon{font-size:36px;text-align:center;margin-bottom:16px}
.dashauth-h1{font-size:18px;font-weight:800;text-align:center;margin-bottom:6px}
.dashauth-desc{font-size:13px;color:#666;text-align:center;line-height:1.55;margin-bottom:20px}
.dashauth-input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.dashauth-input:focus{border-color:var(--yel)}
.dashauth-input.code{font-family:monospace;letter-spacing:.4em;text-align:center;font-size:18px}
.dashauth-btn{width:100%;padding:13px;background:var(--dark);color:#fff;border:0;border-radius:8px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;margin-top:14px;font-family:inherit}
.dashauth-btn:hover{background:#000}.dashauth-btn:disabled{opacity:.5;cursor:not-allowed}
.dashauth-msg{font-size:12.5px;line-height:1.5;margin-top:12px;text-align:center;min-height:18px}
.dashauth-msg.is-error{color:var(--red)}.dashauth-msg a{color:var(--yel);font-weight:600}
.dashauth-back{display:block;text-align:center;margin-top:18px;font-size:12px;color:#888;text-decoration:none}
.dashauth-session{position:fixed;top:10px;right:12px;z-index:10000;background:rgba(141,198,63,.18);color:#6f9200;
  border:1px solid rgba(141,198,63,.35);padding:5px 12px;border-radius:14px;font-size:11px;font-weight:600;display:flex;gap:8px;align-items:center}
.dashauth-session button{background:none;border:0;color:#6f9200;cursor:pointer;font-size:14px;padding:0}
/* ── layout ── */
.topbar{background:var(--dark);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar b{color:var(--yel);font-size:16px;letter-spacing:-.3px}
.topbar nav a{color:#bbb;text-decoration:none;font-size:12.5px;margin-right:14px}
.topbar nav a:hover,.topbar nav a.on{color:var(--yel)}
.wrap{max-width:1280px;margin:0 auto;padding:20px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
     border-radius:10px;padding:12px 14px;margin-bottom:18px;position:sticky;top:0;z-index:50}
.bar label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
select,input[type=date]{font:inherit;font-size:13px;padding:6px 10px;border:1.5px solid var(--line);border-radius:7px;background:#fff}
select:focus,input:focus{outline:2px solid var(--yel);outline-offset:1px}
.hint{font-size:11.5px;color:var(--muted)}
h2{font-size:15px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2 .cnt{font-size:11px;font-weight:600;color:var(--muted);background:#EFEFE8;padding:2px 8px;border-radius:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:6px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi.red{border-left:4px solid var(--red)}.kpi.amb{border-left:4px solid var(--amb)}
.kpi.grn{border-left:4px solid var(--grn)}.kpi.yel{border-left:4px solid var(--yel)}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.kpi-v{font-size:22px;font-weight:800;letter-spacing:-.5px}
.kpi-s{font-size:11.5px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
   padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
td{padding:8px 10px;border-bottom:1px solid #F1F1EC}
tbody tr:hover{background:#FFFBEF}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.t-red{background:#FEE2E2;color:#991B1B}.t-amb{background:#FEF3C7;color:#92400E}
.t-grn{background:#ECFCCB;color:#3F6212}.t-gry{background:#EFEFE8;color:#666}
.an{display:flex;gap:12px;padding:12px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.an.red{border-left:4px solid var(--red)}.an.amber{border-left:4px solid var(--amb)}.an.info{border-left:4px solid #9CA3AF}
.an-i{font-size:20px;line-height:1}
.an-t{font-weight:700;font-size:13.5px}
.an-w{font-size:12px;color:var(--muted);margin:2px 0 4px}
.an-d{font-size:12.5px;line-height:1.55}
.bar-mini{height:6px;background:#EFEFE8;border-radius:3px;overflow:hidden;min-width:60px}
.bar-mini i{display:block;height:100%;background:var(--grn)}
.bar-mini i.red{background:var(--red)}.bar-mini i.amb{background:var(--amb)}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:8px}
/* калькулятор акції */
.pc-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.pc-row label{display:block;font-size:11px;color:var(--muted)}
.pc-row input,.pc-row select{width:100%;margin-top:4px;padding:7px 8px;border:1px solid var(--line);
  border-radius:6px;font-size:13.5px;font-family:inherit;background:#fff}
.pc-row select{max-width:100%}
.pc-line{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.pc-verdict{margin-top:10px;padding:10px 13px;border-radius:8px;font-size:13.5px;line-height:1.6;
  background:rgba(45,106,0,.07);border-left:3px solid var(--grn,#2D6A00)}
.pc-verdict.amb{background:rgba(184,134,11,.09);border-left-color:#B8860B}
.pc-verdict.red{background:rgba(176,0,0,.08);border-left-color:var(--red,#B00)}
.pc-note{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.pc-bad{margin-top:10px;padding:10px 13px;border-radius:8px;font-size:13.5px;
  background:rgba(176,0,0,.09);border-left:3px solid var(--red,#B00)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;padding:9px 14px;
  cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button:hover{color:var(--dark)}
.tabs button.on{color:var(--dark);border-bottom-color:var(--yel)}
.tabs button .n{font-size:10.5px;background:#EFEFE8;border-radius:9px;padding:1px 6px;margin-left:5px;color:#666}
.lead{font-size:12.5px;color:var(--muted);line-height:1.6;background:#FFFDF6;border:1px solid #F2E6C4;
  border-radius:8px;padding:10px 13px;margin-bottom:12px}
.loader{padding:60px;text-align:center;color:var(--muted)}
@media(max-width:640px){.wrap{padding:12px}.bar{position:static}}
/* ── v1.1 (02.10.2026): база мереж, коментарі, пороги ── */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
/* ⚠ Бейдж сесії мав z-index 10000 і накривав кнопки панелей — тримаємо нижче за панель (900). */
.dashauth-session{z-index:800}
/* Бейдж сесії висить у правому куті шапки й накривав напис «дані на…» — лишаємо йому місце. */
.topbar{padding-right:230px}
@media(max-width:640px){.topbar{padding-right:20px}#gen{display:none}}
.btn{font:inherit;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:7px;border:1.5px solid var(--line);
  background:#fff;cursor:pointer;color:var(--dark);white-space:nowrap;
  transition:transform 140ms var(--ease-out),background-color 140ms ease,border-color 140ms ease}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--dark);color:#fff;border-color:var(--dark)}
.btn.yel{background:var(--yel);border-color:var(--yel)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,.rowlink:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
@media(hover:hover) and (pointer:fine){.btn:hover{border-color:#b9b9ae}.btn.pri:hover{background:#000}.chip:hover{border-color:#b9b9ae}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px}
.chip{font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;border:1.5px solid var(--line);
  background:#fff;cursor:pointer;color:#555;transition:transform 140ms var(--ease-out),border-color 140ms ease}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.sp{flex:1}
.cmt{max-width:260px;font-size:12px;line-height:1.4;color:#444}
.cmt .d{color:var(--muted);font-size:11px}
.cmt-btn{font:inherit;font-size:11.5px;font-weight:700;border:1.5px solid var(--line);background:#fff;border-radius:6px;
  padding:3px 8px;cursor:pointer;white-space:nowrap;transition:transform 140ms var(--ease-out)}
.cmt-btn:active{transform:scale(.97)}
.cmt-btn.has{background:#FFF7DB;border-color:#F2D675}
.delta{font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta .up{color:#B45309}.delta .dn{color:#3F6212}.delta .bad{color:var(--red)}.delta .mut{color:var(--muted)}
.rowlink{cursor:pointer}
.netname{font-weight:700}
.sub{font-size:11.5px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:12px}
.pipe button{font:inherit;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;
  transition:transform 140ms var(--ease-out),border-color 140ms ease}
.pipe button:active{transform:scale(.98)}
.pipe button.on{border-color:var(--dark);box-shadow:inset 0 -3px 0 var(--yel)}
.pipe b{display:block;font-size:19px;letter-spacing:-.4px}
.pipe span{font-size:11px;color:var(--muted)}
.meter{height:5px;background:#EFEFE8;border-radius:3px;overflow:hidden;width:64px;display:inline-block;vertical-align:middle;margin-right:6px}
.meter i{display:block;height:100%;background:var(--grn)}
.meter i.amb{background:var(--amb)}.meter i.red{background:var(--red)}
/* панель */
.drawer-back{position:fixed;inset:0;background:rgba(20,20,20,.38);z-index:900;opacity:0;pointer-events:none;transition:opacity 180ms ease}
.drawer-back.open{opacity:1;pointer-events:auto}
/* Закривається швидше (200 мс), ніж відкривається (280 мс): система має відповідати жвавіше, ніж людина вирішує. */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100vw);background:#fff;z-index:901;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform 200ms var(--ease-drawer),visibility 0s linear 200ms;box-shadow:-14px 0 44px rgba(0,0,0,.18);visibility:hidden}
.drawer.open{transform:translateX(0);transition:transform 280ms var(--ease-drawer),visibility 0s;visibility:visible}
.dr-h{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dr-h h3{margin:0;font-size:16px;line-height:1.3}
.dr-x{margin-left:auto;font:inherit;font-size:20px;line-height:1;background:none;border:0;cursor:pointer;color:#888;padding:2px 6px}
.dr-tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto}
.dr-tabs button{font:inherit;font-size:12.5px;font-weight:600;background:none;border:0;padding:10px 9px;cursor:pointer;color:var(--muted);
  border-bottom:3px solid transparent;white-space:nowrap}
.dr-tabs button.on{color:var(--dark);border-bottom-color:var(--yel)}
.dr-b{flex:1;overflow:auto;padding:16px 20px 28px}
.dr-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#FAFAF7}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg .full{grid-column:1/-1}
.f{display:block}
.f>span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;font:inherit;font-size:13.5px;padding:8px 10px;border:1.5px solid var(--line);border-radius:7px;background:#fff}
.f textarea{min-height:74px;resize:vertical;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--yel);outline-offset:1px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{font-size:12px;border:1.5px solid var(--line);border-radius:14px;padding:4px 10px;cursor:pointer;user-select:none}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks label:has(input:checked){background:var(--dark);color:#fff;border-color:var(--dark)}
.sec{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.sec:first-child{margin-top:0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.tl-i{position:relative;padding:0 0 14px}
.tl-i:before{content:'';position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--yel);border:2px solid #fff}
.tl-m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tl-t{font-size:13.5px;line-height:1.5;margin:3px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.tl-n{font-size:12.5px;background:#FFFDF6;border:1px solid #F2E6C4;border-radius:6px;padding:5px 9px;margin-top:4px}
.linkbtn{font:inherit;font-size:11.5px;background:none;border:0;padding:0;color:#666;text-decoration:underline;cursor:pointer}
.linkbtn.danger{color:var(--red)}
.box{background:#FAFAF7;border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:12px}
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #F1F1EC}
.crow:last-child{border-bottom:0}
.miss{font-size:12px;color:#92400E;background:#FEF3C7;border-radius:6px;padding:6px 10px;margin-bottom:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,14px);opacity:0;background:var(--dark);color:#fff;font-size:13px;
  padding:10px 16px;border-radius:9px;z-index:950;pointer-events:none;transition:transform 200ms var(--ease-out),opacity 200ms ease;max-width:90vw}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{background:#991B1B}
.help h3{font-size:14px;margin:22px 0 8px}
.help p,.help li{font-size:13px;line-height:1.65}
.help table td,.help table th{vertical-align:top}
@media(max-width:640px){.fg{grid-template-columns:1fr}.cmt{max-width:170px}}
@media(prefers-reduced-motion:reduce){.drawer,.toast,.btn,.chip,.cmt-btn,.pipe button{transition:none}}
</style>
</head>
<body class="dash-locked">

<!-- ── AUTH GATE ── -->
<div id="dashauth-overlay">
  <div class="dashauth-card">
    <div class="dashauth-logo">snEco</div>
    <div class="dashauth-sub">Витрати · Confidential</div>
    <div id="dashauth-stage"></div>
  </div>
</div>

<div class="topbar">
  <b>snEco · Витрати</b>
  <nav>
    <a href="../">Каталог</a>
    <a href="../finance/finance.html">Фінанси</a>
    <a href="../customer-360/customer-360.html">Customer 360</a>
    <a href="../ask/">AI-асистент</a>
    <a class="on" href="#">Витрати</a>
  </nav>
  <span style="margin-left:auto;font-size:11px;color:#888" id="gen"></span>
</div>

<div class="wrap" id="root">
  <div class="loader">Завантажуємо…</div>
</div>

<div class="drawer-back" id="drawerBack"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Деталі"></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../auth-google.js"></script>
<script>
(function(){
  const WORKER='https://sneco-auth.vg-ab6.workers.dev';
  const BLOCK='expenses-dashboard';
  const STORAGE_KEY='snEco-jwt-'+BLOCK;
  const overlay=document.getElementById('dashauth-overlay');
  const stage=document.getElementById('dashauth-stage');
  let email='';
  window.__exp={token:null};
  function unlock(token,em,exp){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({token,email:em,exp}));}catch(e){}
    window.__exp.token=token;
    document.body.classList.remove('dash-locked');
    overlay.classList.add('is-hidden');
    const b=document.createElement('div');b.className='dashauth-session';
    b.innerHTML='✓ '+em.replace(/[<>&]/g,'')+' <button title="Вийти">🔒</button>';
    b.querySelector('button').onclick=()=>{localStorage.removeItem(STORAGE_KEY);location.reload();};
    document.body.appendChild(b);
    if(window.__expInit)window.__expInit();
  }
  async function verifyExisting(){
    let s;try{s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(e){}
    if(!s||!s.token||!s.exp||s.exp*1000<Date.now())return null;
    try{const r=await fetch(WORKER+'/api/session/verify',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:s.token,block:BLOCK})});
      const j=await r.json();return j.ok?s:null;}catch(e){return null;}
  }
  function renderEmail(){
    stage.innerHTML=`
      <div class="dashauth-icon">💸</div>
      <div class="dashauth-h1">Витрати та окупність</div>
      <div class="dashauth-desc">Окупність трейд-маркетингу, база мереж із журналом контактів і сигнали. Google або email-код. Сесія 30 днів.</div>
      <div id="gsi" style="display:flex;justify-content:center;margin:18px 0 8px"></div>
      <div style="font-size:11px;color:#777;text-align:center;margin:8px 0 4px">— або через email-код —</div>
      <input class="dashauth-input" type="email" id="auth-em" placeholder="ім'я@sneco.ua" autocomplete="email">
      <button class="dashauth-btn" id="auth-send">Надіслати код</button>
      <div class="dashauth-msg" id="auth-msg"></div>
      <a href="../../" class="dashauth-back">← Brand Bible</a>`;
    if(window.SnecoAuth){
      window.SnecoAuth.signInWithGoogle(BLOCK,document.getElementById('gsi'),
        j=>unlock(j.token,j.email,j.exp),
        m=>{const e=document.getElementById('auth-msg');if(e){e.textContent=m;e.className='dashauth-msg is-error';}});
    }
    const em=document.getElementById('auth-em'),send=document.getElementById('auth-send'),msg=document.getElementById('auth-msg');
    em.addEventListener('keydown',e=>{if(e.key==='Enter')send.click();});
    send.onclick=async()=>{
      const v=em.value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){msg.textContent='Введіть правильний email.';msg.className='dashauth-msg is-error';return;}
      send.disabled=true;send.textContent='Надсилаємо...';msg.textContent='';
      try{
        const r=await fetch(WORKER+'/api/otp/request',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email:v,block:BLOCK})});
        if(!r.ok){const j=await r.json().catch(()=>({}));
          msg.innerHTML=j.error==='not_in_whitelist'
            ? `❌ Цього email немає у whitelist. <a href="mailto:vg@sneco.ua?subject=Expenses%20access">✉ Запит доступу</a>`
            : 'Помилка: '+(j.error||r.status);
          msg.className='dashauth-msg is-error';send.disabled=false;send.textContent='Надіслати код';return;}
        email=v;renderCode();
      }catch(e){msg.textContent='Помилка мережі: '+e.message;msg.className='dashauth-msg is-error';
        send.disabled=false;send.textContent='Надіслати код';}
    };
  }
  function renderCode(){
    stage.innerHTML=`
      <div class="dashauth-icon">🔢</div>
      <div class="dashauth-h1">Код надіслано</div>
      <div class="dashauth-desc">Перевір пошту <b>${email.replace(/[<>&]/g,'')}</b> — код дійсний 10 хвилин.</div>
      <input class="dashauth-input code" id="auth-code" maxlength="6" inputmode="numeric" placeholder="000000">
      <button class="dashauth-btn" id="auth-ok">Увійти</button>
      <div class="dashauth-msg" id="auth-msg"></div>
      <a href="javascript:void(0)" class="dashauth-back" id="auth-again">← інший email</a>`;
    const c=document.getElementById('auth-code'),ok=document.getElementById('auth-ok'),msg=document.getElementById('auth-msg');
    c.focus();c.addEventListener('keydown',e=>{if(e.key==='Enter')ok.click();});
    document.getElementById('auth-again').onclick=renderEmail;
    ok.onclick=async()=>{
      const v=c.value.trim();
      if(!/^\d{6}$/.test(v)){msg.textContent='Код — 6 цифр.';msg.className='dashauth-msg is-error';return;}
      ok.disabled=true;ok.textContent='Перевіряємо...';
      try{
        const r=await fetch(WORKER+'/api/otp/verify',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({email,code:v,block:BLOCK})});
        const j=await r.json();
        if(!r.ok||!j.token){msg.textContent=j.error==='bad_code'?'Невірний код.':('Помилка: '+(j.error||r.status));
          msg.className='dashauth-msg is-error';ok.disabled=false;ok.textContent='Увійти';return;}
        unlock(j.token,email,j.exp);
      }catch(e){msg.textContent='Помилка мережі.';msg.className='dashauth-msg is-error';ok.disabled=false;ok.textContent='Увійти';}
    };
  }
  verifyExisting().then(s=>{ if(s) unlock(s.token,s.email,s.exp); else renderEmail(); });
})();

const WORKER='https://sneco-auth.vg-ab6.workers.dev';
let D=null, PERIOD='all', ITEM='Маркетинг и реклама';

const nf=n=>(n==null?'—':Math.round(n).toLocaleString('uk-UA'));
const esc=s=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const pct=x=>x==null?'—':(x*100).toFixed(0)+'%';

// які місяці входять у вибраний період
function monthsIn(){
  if(!D) return [];
  const all=D.months;
  if(PERIOD==='all') return all;
  if(PERIOD.startsWith('year:')) return all.filter(m=>m.startsWith(PERIOD.slice(5)));
  if(PERIOD.startsWith('month:')) return all.filter(m=>m===PERIOD.slice(6));
  if(PERIOD==='last3') return all.slice(-3);
  if(PERIOD==='last6') return all.slice(-6);
  if(PERIOD==='last12') return all.slice(-12);
  return all;
}

function periodOptions(){
  const yrs=[...new Set(D.months.map(m=>m.slice(0,4)))].sort().reverse();
  const MN=['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
  let h='<optgroup label="Швидкі">'
    +'<option value="all">Весь час</option>'
    +'<option value="last3">Останні 3 міс</option>'
    +'<option value="last6">Останні 6 міс</option>'
    +'<option value="last12">Останні 12 міс</option></optgroup>';
  h+='<optgroup label="Рік">'+yrs.map(y=>`<option value="year:${y}">${y} рік</option>`).join('')+'</optgroup>';
  h+='<optgroup label="Місяць">'+D.months.slice().reverse().slice(0,24).map(m=>{
      const [y,mm]=m.split('-');return `<option value="month:${m}">${MN[+mm-1]} ${y}</option>`;}).join('')+'</optgroup>';
  return h;
}

function itemTotal(it,ms){ return ms.reduce((a,m)=>a+(it.by_month[m]||0),0); }

// Живе саме тут, а не в публічній частині Brand Bible: сторінка під гейтом,
// тож можна підставити справжню собівартість замість ручного вводу.
// ⚠ Прибуток валовий — сировина й техоперації. Оренда, зарплати, логістика
// і маркетинг не враховані, тож реальний поріг завжди вищий за розрахунковий.
function renderPromoCalc(){
  const sku=(D.sku_economics||[]);
  if(!sku.length) return '<div class="card empty">Немає даних про собівартість. Дочекайся нічного синку.</div>';
  const opts=sku.map((s,i)=>`<option value="${i}">${esc(s.name)} · ${s.qty_mo} шт/міс</option>`).join('');
  return `<div class="card">
    <div class="pc-row">
      <label>Товар<select id="pc-sku">${opts}</select></label>
      <label>Ціна, ₴<input id="pc-price" type="number" step="0.01"></label>
      <label>Собівартість, ₴<input id="pc-cost" type="number" step="0.01"></label>
      <label>Обсяг/міс, шт<input id="pc-qty" type="number" step="100"></label>
      <label>Знижка, %<input id="pc-disc" type="number" step="1" value="15"></label>
    </div>
    <div id="pc-out" class="pc-out"></div>
  </div>`;
}

function pcCalc(){
  const sku=(D.sku_economics||[]);
  const g=id=>document.getElementById(id);
  const out=g('pc-out'); if(!out) return;
  const p=+g('pc-price').value||0, c=+g('pc-cost').value||0,
        q=+g('pc-qty').value||0,  d=+g('pc-disc').value||0;
  if(p<=0||p<=c){ out.innerHTML='<div class="pc-bad">Ціна має бути більшою за собівартість.</div>'; return; }
  const m0=p-c, np=p*(1-d/100), m1=np-c, prof0=m0*q;
  const need=m1>0?prof0/m1:Infinity, lift=m1>0?(need/q-1)*100:Infinity;
  const rows=[
    ['Маржа зараз', `${m0.toFixed(2)} ₴/шт · ${(m0/p*100).toFixed(1)}%`],
    ['Ціна зі знижкою', `${np.toFixed(2)} ₴`],
    ['Маржа після знижки', m1>0?`${m1.toFixed(2)} ₴/шт · ${(m1/np*100).toFixed(1)}%`:'<b style="color:var(--red)">нижче собівартості</b>'],
    ['Валовий прибуток зараз', `${nf(prof0)} ₴/міс`],
  ].map(r=>`<div class="pc-line"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  let verdict;
  if(m1<=0){
    verdict='<div class="pc-bad"><b>Так не можна.</b> Знижка заводить ціну нижче собівартості — кожна продана пачка збільшує збиток.</div>';
  }else{
    const cls=lift<=30?'grn':lift<=70?'amb':'red';
    const note=lift<=30?'Реалістично — такий приріст промо зазвичай дає.'
              :lift<=70?'Амбітно. Просіть зобов’язання по обсягу і додаткову викладку.'
              :'Малоймовірно. Краще менша знижка або компенсація іншим — викладка, спільний маркетинг.';
    verdict=`<div class="pc-verdict ${cls}">Щоб не втратити гроші, обсяг має вирости на
      <b>+${lift.toFixed(0)}%</b> — з ${nf(q)} до ${nf(Math.ceil(need))} шт/міс.
      <span class="pc-note">${note}</span></div>`;
  }
  out.innerHTML=rows+verdict+
    '<div class="note">Прибуток валовий: сировина і техоперації. Оренда, зарплати, логістика й маркетинг '+
    'не враховані, тож реальний поріг вищий. І ще: обсяг після акції рідко лишається на новому рівні — '+
    'частина приросту це викуп «про запас», який з’їсть наступний місяць.</div>';
}

function pcBind(){
  const sku=(D.sku_economics||[]);
  const g=id=>document.getElementById(id);
  if(!g('pc-sku')) return;
  const fill=()=>{ const s=sku[+g('pc-sku').value]||sku[0]; if(!s) return;
    g('pc-price').value=s.price; g('pc-cost').value=s.cost; g('pc-qty').value=s.qty_mo; pcCalc(); };
  g('pc-sku').addEventListener('change',fill);
  ['pc-price','pc-cost','pc-qty','pc-disc'].forEach(i=>g(i).addEventListener('input',pcCalc));
  fill();
}

async function api(path,body){

    headers:{'Content-Type':'application/json','Authorization':'Bearer '+window.__exp.token},body:JSON.stringify(body||{})});

}

const liveNets=()=>T?T.networks.filter(n=>!n.archived):[];

function thrOf(net){
  const s=ST(); let a=s.payback_amber,r=s.payback_red,own=false;
  if(net){ if(net.payback_amber){a=net.payback_amber;own=true;} if(net.payback_red){r=net.payback_red;own=true;} }
  return {a,r:Math.max(a,r),own};
}
// «понад 20%» — жовтий, «понад 25%» — червоний. Рівно на порозі ще не сигнал.
function pbClass(spend,gross,share,kind,net){
  if(kind==='vendor') return 'gry';
  if(share==null) return (spend>0&&gross<=0)?'red':'gry';
  const t=thrOf(net); return share>t.r?'red':share>t.a?'amb':'grn';
}
function deltaCell(s6,g6){
  if(!s6||!g6||s6.length<2) return '<span class="delta mut">—</span>';
  const s0=s6[s6.length-2],s1=s6[s6.length-1],g0=g6[g6.length-2],g1=g6[g6.length-1];
  const one=(a,b,badUp)=>{
    if(!a&&!b) return '<span class="mut">—</span>';
    if(a<=0) return `<span class="${badUp?'up':'dn'}">з нуля</span>`;
    const p=(b-a)/a, big=Math.abs(p)>=ST().mom_pct&&Math.abs(b-a)>=ST().mom_min_uah;
    const cls=!big?'mut':(p>0?(badUp?'up':'dn'):(badUp?'dn':'bad'));
    return `<span class="${cls}">${p>0?'▲':p<0?'▼':'•'} ${Math.abs(p*100).toFixed(0)}%</span>`;
  };
  return `<span class="delta" title="маркетинг ${nf(s0)} → ${nf(s1)} грн · валовий прибуток ${nf(g0)} → ${nf(g1)} грн">м ${one(s0,s1,true)} · п ${one(g0,g1,false)}</span>`;
}

function noteStat(row){
  if(!T) return null;
  // Запис має і контрагента, і мережу, тож лічильники не складаємо, а беремо більший.
  let best=null,nCp=0,nNet=0;
  const see=s=>{ if(s&&(!best||s.last_date>best.last_date)) best=s; };
  row.ids.forEach(id=>{ const s=T.notes_by_cp[id]; if(s){ nCp+=s.n; see(s); } });
  if(PB_MODE==='net'&&row.netw){ const s=T.notes_by_network[row.netw.id]; if(s){ nNet=s.n; see(s); } }
  return best?{n:Math.max(nCp,nNet),last_date:best.last_date,last_summary:best.last_summary,last_author:best.last_author}:null;
}

// ── стан бази мереж (для блоку «Що потребує уваги» і вкладки) ─────────────
function netFlags(n){
  const s=ST(), f=[];
  if(n.archived) return f;
  if(n.stale_days!=null&&n.stale_days>=s.stale_red_days) f.push('stale_red');
  else if(n.stale_days!=null&&n.stale_days>=s.stale_warn_days) f.push('stale_warn');
  if(n.next_date&&n.next_date<today()&&n.stage!=='paused'&&n.stage!=='declined') f.push('due');
  if(n.missing&&n.missing.length) f.push('incomplete');
  return f;
}
function suggestions(){
  if(!T) return [];
  const taken=new Set(); liveNets().forEach(n=>n.cp_ids.forEach(x=>taken.add(x)));
  if(D.payback_groups) return D.payback_groups.filter(g=>g.spend>0&&!g.ids.some(x=>taken.has(x)))
    .map(g=>({name:g.name,combined_key:g.key[0]==='c'?g.key.slice(1):null,cp_ids:g.ids,spend:g.spend,share:g.share_gross}));
  const by={};
  (D.payback||[]).filter(r=>r.spend>0&&r.kind!=='vendor'&&!taken.has(r.id)).forEach(r=>{
    const ck=T.cp_meta[r.id]&&T.cp_meta[r.id].combined_key, k=ck||r.id;
    const g=by[k]||(by[k]={name:ck||r.name,combined_key:ck||null,cp_ids:[],spend:0,share:null}); g.cp_ids.push(r.id); g.spend+=r.spend;});
  return Object.values(by);
}

function netPayback(n){
  if(!n.cp_ids.length) return null;
  const g=(D.payback_groups||[]).find(g=>g.ids.some(id=>n.cp_ids.includes(id)));
  if(g) return {spend:g.spend,gross:g.gross,share:g.share_gross};
  const rs=(D.payback||[]).filter(r=>n.cp_ids.includes(r.id)); if(!rs.length) return null;
  const spend=rs.reduce((a,r)=>a+r.spend,0), gross=rs.reduce((a,r)=>a+r.gross,0);
  return {spend,gross,share:gross>0?spend/gross:null};
}
function completeness(n){
  const quiet=n.stage==='paused'||n.stage==='declined';
  const total=3+(quiet?0:1)+((n.stage==='agreed'||n.stage==='active')?3:0)+(n.stage==='declined'?1:0);
  return Math.max(0,Math.round((1-(n.missing||[]).length/total)*100));
}
function staleTag(n){
  if(n.stale_days==null) return '<span class="hint">—</span>';
  const s=ST(), cls=n.stale_days>=s.stale_red_days?'red':n.stale_days>=s.stale_warn_days?'amb':'grn';
  return `<span class="tag t-${cls}">${n.stale_days===0?'сьогодні':n.stale_days+' дн'}</span>`;
}
function filteredNets(){
  if(!T) return [];
  const q=NETF.q.trim().toLowerCase();
  return T.networks.filter(n=>{
    if(!!n.archived!==NETF.arch) return false;
    if(NETF.stage&&n.stage!==NETF.stage) return false;
    if(NETF.flag){ const f=netFlags(n);
      if(NETF.flag==='stale'&&!f.includes('stale_red')&&!f.includes('stale_warn')) return false;
      if(NETF.flag==='due'&&!f.includes('due')) return false;
      if(NETF.flag==='incomplete'&&!f.includes('incomplete')) return false; }
    if(q){ const hay=[n.name,n.region,n.owner_email,n.next_step,SEG_UA[n.segment],...(n.contacts||[]).map(c=>c.full_name)].join(' ').toLowerCase();
      if(!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=>{
    // Спершу те, що горить: прострочені кроки, потім найдовше без оновлень.
    const fa=netFlags(a),fb=netFlags(b), w=f=>(f.includes('due')?4:0)+(f.includes('stale_red')?2:0)+(f.includes('stale_warn')?1:0);
    return w(fb)-w(fa)||(b.stale_days||0)-(a.stale_days||0)||a.name.localeCompare(b.name,'uk');
  });
}

        <br><span class="sub">${esc(SEG_UA[n.segment]||'формат не вказано')}${n.region?' · '+esc(n.region):''}${n.cp_ids.length?'':' · без контрагента в МойСкладі'}</span></td>

async function busy(btn,fn){
  if(btn){ if(btn.disabled) return; btn.disabled=true; }
  try{ await fn(); }catch(e){ toast(e.code==='cp_already_linked'?`${e.message}: «${e.data.network}».`:e.message,true); }
  finally{ if(btn&&btn.isConnected) btn.disabled=false; }
}
// Видалення у два кліки замість системного confirm(): перший клік «заряджає» кнопку на 3 секунди.
function armed(btn,label){
  if(btn.dataset.armed) return true;
  btn.dataset.armed='1'; btn.dataset.old=btn.textContent; btn.textContent=label;
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=btn.dataset.old; } },3000);
  return false;
}

  net:b=>openDrawer({kind:'net',netId:+b.dataset.id,tab:'card'}),
  'net-journal':b=>openDrawer({kind:'net',netId:+b.dataset.id,tab:'journal'}),
  'net-new':()=>openDrawer({kind:'net',netId:null,tab:'card'}),
  'net-tab':b=>{ readNetForm(); DR.tab=b.dataset.v; DR.edit=null; DR.ctEdit=null; if(DR.tab==='journal') DR.notes=null; if(DR.tab==='audit') DR.audit=null; renderDrawer(); },
  'jr-scope':b=>{ DR.scope=b.dataset.v; DR.notes=null; renderDrawer(); },
  'jr-edit':b=>{ DR.edit=(DR.notes||[]).find(n=>n.id===b.dataset.id)||null; renderDrawer().then(()=>{ const f=$('jr-form'); if(f) f.scrollIntoView({block:'nearest'}); }); },
  'jr-cancel':()=>{ DR.edit=null; renderDrawer(); },
  'jr-save':b=>busy(b,async()=>{
    const body={note_date:$('jr-date').value,note_type:$('jr-type').value,summary:$('jr-sum').value.trim(),
      next_step:$('jr-next').value.trim()||null,next_date:$('jr-nextd').value||null};
    if(!body.summary){ toast('Напишіть текст запису.',true); $('jr-sum').focus(); return; }
    if(body.next_step&&!body.next_date){ toast('Вкажіть дату наступного кроку.',true); $('jr-nextd').focus(); return; }
    if(DR.edit) body.id=DR.edit.id; else if(DR.kind==='net') body.network_id=DR.netId; else body.cp_id=DR.cpId;
    const r=await api('/api/trade/note-save',body);
    DR.edit=null; DR.notes=null; toast(r.ms_sync_pending?'Запис збережено, дописуємо в МойСклад':'Запис збережено'); await refresh();
  }),
  'jr-del':b=>{ if(!armed(b,'точно видалити?')) return; busy(b,async()=>{ await api('/api/trade/note-delete',{id:b.dataset.id}); DR.notes=null; toast('Запис видалено'); await refresh(); }); },
  'net-save':b=>busy(b,async()=>{
    readNetForm(); const d=DR.draft;
    if(!d.name){ toast('Вкажіть назву мережі.',true); $('nf-name').focus(); return; }
    if(d.next_step&&!d.next_date){ toast('Вкажіть дату наступного кроку.',true); $('nf-nextd').focus(); return; }
    const data={name:d.name,stage:d.stage,segment:d.segment,priority:d.priority,region:d.region,stores_count:d.stores_count,website:d.website,
      owner_email:d.owner_email,tm_types:d.tm_types,tm_terms:d.tm_terms,tm_budget_month_kop:d.tm_budget_month_kop,contract_until:d.contract_until,
      next_step:d.next_step,next_date:d.next_date,decline_reason:d.decline_reason,notes:d.notes};
    if(T.me.isAdmin){ data.payback_amber=d.payback_amber; data.payback_red=d.payback_red; }
    const r=await api('/api/trade/network-save',{id:d.id||undefined,data});
    const wasNew=!d.id; DR.netId=r.id; DR.draft=null; if(wasNew) DR.tab='contacts';
    toast(wasNew?'Мережу створено. Додайте контакт.':'Збережено'); await refresh();
  }),
  'net-arch':b=>{ const n=netById(DR.netId); if(!n.archived&&!armed(b,'Точно в архів?')) return;
    busy(b,async()=>{ await api('/api/trade/network-archive',{id:DR.netId,archived:!n.archived}); DR.draft=null; toast(n.archived?'Повернуто з архіву':'Мережу перенесено в архів'); closeDrawer(); await refresh(); }); },
  'ct-edit':b=>{ DR.ctEdit=(netById(DR.netId).contacts||[]).find(c=>c.id===+b.dataset.id)||null; renderDrawer(); },
  'ct-cancel':()=>{ DR.ctEdit=null; renderDrawer(); },
  'ct-save':b=>busy(b,async()=>{
    const data={full_name:$('ct-name').value.trim(),role:$('ct-role').value.trim(),phone:$('ct-phone').value.trim(),email:$('ct-email').value.trim(),
      messenger:$('ct-msg').value.trim(),notes:$('ct-notes').value.trim(),is_primary:$('ct-prim').checked};
    if(!data.full_name){ toast('Вкажіть ім’я контакту.',true); $('ct-name').focus(); return; }
    await api('/api/trade/contact-save',{id:DR.ctEdit?DR.ctEdit.id:undefined,network_id:DR.netId,data});
    DR.ctEdit=null; DR.draft=null; toast('Контакт збережено'); await refresh();
  }),
  'ct-del':b=>{ if(!armed(b,'точно видалити?')) return; busy(b,async()=>{ await api('/api/trade/contact-delete',{id:+b.dataset.id}); DR.draft=null; toast('Контакт видалено'); await refresh(); }); },
  'cp-add':b=>busy(b,async()=>{ const n=netById(DR.netId);
    DR.cpNames=DR.cpNames||{}; DR.cpNames[b.dataset.id]=b.dataset.name;
    await api('/api/trade/network-save',{id:n.id,data:{cp_ids:[...n.cp_ids,b.dataset.id]}}); DR.draft=null; toast('Контрагента прив’язано'); await refresh(); }),
  'cp-rm':b=>{ if(!armed(b,'точно відв’язати?')) return; busy(b,async()=>{ const n=netById(DR.netId);
    await api('/api/trade/network-save',{id:n.id,data:{cp_ids:n.cp_ids.filter(x=>x!==b.dataset.id)}}); DR.draft=null; toast('Контрагента відв’язано'); await refresh(); }); },
  'import-all':b=>busy(b,async()=>{ const items=suggestions().map(s=>({name:s.name,combined_key:s.combined_key,cp_ids:s.cp_ids}));
    const r=await api('/api/trade/network-import',{items}); toast(`Додано мереж: ${r.created}`); await refresh(); }),
  'set-save':b=>busy(b,async()=>{
    const n=id=>parseFloat($(id).value);
    const settings={payback_amber:n('st-amb')/100,payback_red:n('st-red')/100,stale_warn_days:n('st-warn'),stale_red_days:n('st-stale'),mom_pct:n('st-mom')/100,mom_min_uah:n('st-min')};
    if(Object.values(settings).some(x=>isNaN(x))){ toast('Заповніть усі поля числами.',true); return; }
    if(settings.payback_red<=settings.payback_amber){ toast(ERR_UA.red_must_exceed_amber,true); return; }
    if(settings.stale_red_days<settings.stale_warn_days){ toast(ERR_UA.stale_red_before_warn,true); return; }
    await api('/api/trade/settings-save',{settings}); toast('Пороги збережено'); closeDrawer(); await refresh();
  }),
};
document.addEventListener('click',e=>{
  if(e.target.id==='drawerBack'){ closeDrawer(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  // Клік по кнопці чи посиланню всередині рядка-посилання не має відкривати сам рядок.
  const inner=e.target.closest('button,a,input,select,textarea,label'); if(inner&&inner!==b&&b.contains(inner)) return;
  const f=ACT[b.dataset.act]; if(f) f(b);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&DR.kind){ closeDrawer(); return; }
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('rowlink')){ const f=ACT[e.target.dataset.act]; if(f) f(e.target); }
});
let _cpT=null;
document.addEventListener('input',e=>{
  if(e.target.id==='net-q'){ NETF.q=e.target.value; const tb=$('net-tbody'); if(tb) tb.innerHTML=renderNetRows(); return; }
  if(e.target.id==='cp-q'){
    clearTimeout(_cpT); const q=e.target.value;
    _cpT=setTimeout(async()=>{
      const box=$('cp-res'); if(!box) return;
      if(q.trim().length<2){ box.innerHTML=''; return; }
      try{
        const r=await api('/api/trade/cp-search',{q}); if(!$('cp-res')||$('cp-q').value!==q) return;
        const n=netById(DR.netId);
        box.innerHTML=r.items.length?r.items.map(c=>{
          const other=liveNets().find(x=>x.id!==n.id&&x.cp_ids.includes(c.id)), mine=n.cp_ids.includes(c.id);
          return `<div class="crow"><div style="flex:1"><b>${esc(c.name)}</b>${c.combined_key?`<br><span class="sub">група в МойСкладі: ${esc(c.combined_key)}</span>`:''}</div>
            ${mine?'<span class="tag t-grn">уже тут</span>':other?`<span class="tag t-gry">у мережі «${esc(other.name)}»</span>`
              :`<button class="btn sm" data-act="cp-add" data-id="${c.id}" data-name="${esc(c.name)}">Прив’язати</button>`}</div>`;}).join('')
          :'<div class="empty">Нічого не знайдено.</div>';
      }catch(err){ box.innerHTML='<div class="empty">'+esc(err.message)+'</div>'; }
    },250);
  }
});

window.__expInit=async function(){
  try{
    // ⚠ POST з ім'ям у тілі. GET на цей роут віддає 405.
    const r=await fetch(WORKER+'/api/dashboard/blob',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+window.__exp.token},
      body:JSON.stringify({name:'expenses'})});
    if(r.status===401){document.getElementById('root').innerHTML=
      '<div class="card empty">Сесія застаріла. <a href="javascript:location.reload()">Оновити</a></div>';return;}
    if(!r.ok) throw new Error('HTTP '+r.status);
    D=await r.json();
    if(typeof D==='string') D=JSON.parse(D);
    PERIOD = D.months.length>12 ? 'last12' : 'all';
    // База мереж і коментарі — окремим запитом. Якщо він не вдався, окупність усе одно показуємо.
    await loadTrade();
    draw();
  }catch(e){
    document.getElementById('root').innerHTML=
      `<div class="card empty">Не вдалось завантажити дані: ${esc(e.message)}<br>
       <span class="hint">Якщо це перший запуск — синк ще не відпрацював. Він о 07:00 щодня.</span></div>`;
  }
};
</script>
