<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @font-face{font-family:'Qanelas';font-weight:400;src:url('logo/../fonts/Qanelas-Regular.woff2') format('woff2');}
  @font-face{font-family:'Qanelas';font-weight:700;src:url('fonts/Qanelas-Bold.woff2') format('woff2');}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#1F1C1C;font-family:'Qanelas',-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;}
  .trust{padding:64px 24px;max-width:1280px;margin:0 auto;text-align:center;}
  .trust__label{color:#EDAB21;font-size:14px;letter-spacing:3px;text-transform:uppercase;font-weight:700;margin-bottom:10px;}
  .trust__title{font-size:38px;line-height:1.05;text-transform:uppercase;font-weight:700;letter-spacing:1px;margin-bottom:40px;}
  .trust__title b{color:#EDAB21;}
  .badges{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-bottom:44px;}
  .badge{flex:1 1 180px;max-width:210px;background:#272422;border:1px solid #3a3633;border-radius:14px;padding:24px 18px;transition:.2s;}
  .badge:hover{border-color:#EDAB21;transform:translateY(-3px);}
  .badge__ico{width:46px;height:46px;margin:0 auto 14px;border-radius:50%;background:rgba(237,171,33,.12);display:flex;align-items:center;justify-content:center;}
  .badge__ico svg{width:24px;height:24px;stroke:#EDAB21;fill:none;stroke-width:2;}
  .badge__t{font-size:16px;font-weight:700;line-height:1.2;margin-bottom:6px;}
  .badge__s{font-size:13px;color:#a9a39c;line-height:1.3;}
  .metrics{display:flex;flex-wrap:wrap;justify-content:center;gap:48px;border-top:1px solid #3a3633;padding-top:36px;}
  .metric__n{font-size:44px;font-weight:700;color:#EDAB21;line-height:1;}
  .metric__l{font-size:14px;color:#cfc9c2;margin-top:8px;}
  @media(max-width:760px){.trust__title{font-size:27px;}.metrics{gap:28px;}.metric__n{font-size:34px;}}
</style>
</head>
<body>
<section class="trust">
  <div class="trust__label">Визнання та досягнення</div>
  <h2 class="trust__title">Якість, яку <b>визнали у світі</b></h2>

  <div class="badges">
    <div class="badge">
      <div class="badge__ico"><svg viewBox="0 0 24 24"><path d="M8 21h8m-4-4v4M7 4h10v5a5 5 0 0 1-10 0V4zM5 6H3v1a3 3 0 0 0 2 2.8M19 6h2v1a3 3 0 0 1-2 2.8"/></svg></div>
      <div class="badge__t">SIAL Grand Prix</div>
      <div class="badge__s">Innovation 2024 · Париж</div>
    </div>
    <div class="badge">
      <div class="badge__ico"><svg viewBox="0 0 24 24"><path d="M12 17.75 5.8 21l1.2-6.9-5-4.9 6.9-1L12 2l3.1 6.2 6.9 1-5 4.9L18.2 21z"/></svg></div>
      <div class="badge__t">Forbes</div>
      <div class="badge__s">«Next 250»</div>
    </div>
    <div class="badge">
      <div class="badge__ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div>
      <div class="badge__t">Gulfood 2025</div>
      <div class="badge__s">Shortlist · Дубай</div>
    </div>
    <div class="badge">
      <div class="badge__ico"><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m-3-7 2.5 1.8 3-.2.9 2.9 2.4 1.8-1.2 2.8 1.2 2.8-2.4 1.8-.9 2.9-3-.2L12 22l-2.6-2.1-3 .2-.9-2.9L3.1 15.4 4.3 12.6 3.1 9.8l2.4-1.8.9-2.9 3 .2z"/></svg></div>
      <div class="badge__t">IFS Food v8</div>
      <div class="badge__s">Сертифіковано 2026</div>
    </div>
    <div class="badge">
      <div class="badge__ico"><svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <div class="badge__t">FSSC 22000</div>
      <div class="badge__s">ISO 22000 · HACCP</div>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><div class="metric__n">76%</div><div class="metric__l">повторних покупок онлайн</div></div>
    <div class="metric"><div class="metric__n">20+</div><div class="metric__l">країн експорту</div></div>
    <div class="metric"><div class="metric__n">×25</div><div class="metric__l">зростання за 6 років</div></div>
  </div>
</section>
</body>
</html>
